<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-dashboard">

  <header class="header">
    <img src="banking icon.png" alt="Bank Logo" class="logo">
  </header>

  <!-- Open Modal Button -->
  <button id="openModalBtn" class="add-account-button">+ Add New Account</button>

  <!-- Empty wrapper: Cards will be injected here via JS -->
  <main class="cards-wrapper" id="cardsContainer">
    <p id="emptyMsg" class="empty-msg">No accounts added yet. Click "+ Add New Account" above.</p>
  </main>

  <!-- Modal Popup Form -->
  <div id="accountModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add Account</h3>
        <button type="button" id="closeModalBtn" class="close-btn">&times;</button>
      </div>

      <form id="accountForm">
        <div class="dropdown-group">
          <label for="accountType">Account Type</label>
          <select id="accountType" required>
            <option value="" disabled selected>-- Select Type --</option>
            <option value="Savings">Savings Account</option>
            <option value="Checking">Checking Account</option>
            <option value="Business">Business Account</option>
            <option value="Credit">Credit Card</option>
          </select>
        </div>

        <div class="dropdown-group">
          <label for="accountDesc">Description</label>
          <input type="text" id="accountDesc" placeholder="e.g. Personal spending account" required>
        </div>

        <button type="submit" class="submit-btn">Create Card</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
