<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-dashboard">

  <!-- Top-left branding -->
  <header class="header">
    <img src="banking icon.png" alt="Bank Logo" class="logo">
  </header>

  <!-- Row container -->
  <div class="cards-wrapper">

    <!-- Card 1 -->
    <div class="card-thing">
      <div class="image">
        <img src="bank.png" alt="Account 1 icon">
      </div>
      <div class="name">
        <h2>Account 1</h2>
      </div>
      <div class="description">
        <p>bunch of stuff about the acc</p>
      </div>
      <div class="social-links">
        <a href="#">Twitter</a> | <a href="#">LinkedIn</a>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card-thing">
      <div class="image">
        <img src="bank.png" alt="Account 2 icon">
      </div>
      <div class="name">
        <h2>Account 2</h2>
      </div>
      <div class="description">
        <p>bunch of stuff about the acc</p>
      </div>
      <div class="social-links">
        <a href="#">Twitter</a> | <a href="#">LinkedIn</a>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card-thing">
      <div class="image">
        <img src="bank.png" alt="Account 3 icon">
      </div>
      <div class="name">
        <h2>Account 3</h2>
      </div>
      <div class="description">
        <p>bunch of stuff about the acc</p>
      </div>
      <div class="social-links">
        <a href="#">Twitter</a> | <a href="#">LinkedIn</a>
      </div>
    </div>

  </div>

  

</body>
</html>
